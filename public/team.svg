<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="figC" x1="98" y1="70" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="figS" x1="60" y1="96" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E99F3"/>
      <stop offset="0.5" stop-color="#5256D4"/>
      <stop offset="1" stop-color="#3A35A8"/>
    </linearGradient>
    <radialGradient id="headC" cx="0.38" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#F1F4FF"/>
      <stop offset="0.45" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#5B5FE0"/>
    </radialGradient>
    <radialGradient id="headS" cx="0.38" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#E3E8FF"/>
      <stop offset="0.5" stop-color="#8E99F3"/>
      <stop offset="1" stop-color="#4B47C0"/>
    </radialGradient>
    <linearGradient id="podTop" x1="128" y1="180" x2="128" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="podSide" x1="128" y1="196" x2="128" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="128" cy="216" rx="76" ry="20" fill="#312E81" opacity="0.18" filter="url(#soft)"/>

  <!-- podium -->
  <ellipse cx="128" cy="208" rx="72" ry="20" fill="url(#podSide)"/>
  <ellipse cx="128" cy="200" rx="72" ry="20" fill="url(#podSide)"/>
  <ellipse cx="128" cy="196" rx="60" ry="16" fill="url(#podTop)"/>

  <!-- left figure -->
  <path d="M66 200 L66 156 C66 126 114 126 114 156 L114 200 Z" fill="url(#figS)"/>
  <circle cx="90" cy="118" r="18" fill="url(#headS)"/>
  <!-- right figure -->
  <path d="M142 200 L142 156 C142 126 190 126 190 156 L190 200 Z" fill="url(#figS)"/>
  <circle cx="166" cy="118" r="18" fill="url(#headS)"/>

  <!-- center figure (front) -->
  <path d="M96 200 L96 150 C96 106 160 106 160 150 L160 200 Z" fill="url(#figC)"/>
  <circle cx="128" cy="96" r="27" fill="url(#headC)"/>

  <!-- podium front rim highlight -->
  <path d="M72 196 Q72 182 128 180 Q184 182 184 196" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="3" fill="none"/>

  <!-- specular highlights -->
  <ellipse cx="118" cy="87" rx="8" ry="6" fill="#FFFFFF" opacity="0.7" transform="rotate(-25 118 87)"/>
  <ellipse cx="83" cy="111" rx="5" ry="4" fill="#FFFFFF" opacity="0.55" transform="rotate(-25 83 111)"/>
  <ellipse cx="159" cy="111" rx="5" ry="4" fill="#FFFFFF" opacity="0.55" transform="rotate(-25 159 111)"/>
  <path d="M110 156 Q128 148 146 156 Q132 162 128 162 Q124 162 110 156 Z" fill="#FFFFFF" opacity="0.18"/>
</svg>
