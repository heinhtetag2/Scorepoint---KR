<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ScoreShot">
  <defs>
    <linearGradient id="ssm-tile" x1="32" y1="20" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#198754"/>
      <stop offset="0.55" stop-color="#0F5132"/>
      <stop offset="1" stop-color="#0A3D26"/>
    </linearGradient>
    <linearGradient id="ssm-gold" x1="48" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EBD27A"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#A6841B"/>
    </linearGradient>
    <radialGradient id="ssm-ball" cx="0.38" cy="0.32" r="0.85" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#F2F4F1"/>
      <stop offset="1" stop-color="#D7DCD6"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background; OS applies the mask. -->
  <rect x="0" y="0" width="256" height="256" fill="url(#ssm-tile)"/>

  <!-- Mark scaled to ~64% inside the maskable safe zone (centered). -->
  <g transform="translate(128,128) scale(0.64) translate(-128,-128)">
    <g stroke="url(#ssm-gold)" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M64 90 V72 Q64 64 72 64 H90"/>
      <path d="M166 64 H184 Q192 64 192 72 V90"/>
      <path d="M192 166 V184 Q192 192 184 192 H166"/>
      <path d="M90 192 H72 Q64 192 64 184 V166"/>
    </g>
    <circle cx="128" cy="128" r="42" fill="url(#ssm-ball)"/>
    <g fill="#C5CCC4" opacity="0.55">
      <circle cx="128" cy="106" r="3.2"/>
      <circle cx="111" cy="113" r="3.2"/><circle cx="145" cy="113" r="3.2"/>
      <circle cx="103" cy="128" r="3.2"/><circle cx="128" cy="128" r="3.2"/><circle cx="153" cy="128" r="3.2"/>
      <circle cx="111" cy="143" r="3.2"/><circle cx="145" cy="143" r="3.2"/>
      <circle cx="128" cy="150" r="3.2"/>
    </g>
    <ellipse cx="114" cy="114" rx="11" ry="7.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-32 114 114)"/>
  </g>
</svg>
