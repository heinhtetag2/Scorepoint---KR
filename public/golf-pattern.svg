<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Faint golf motifs that tile seamlessly (kept inside the tile, no edge crossing) -->
  <g stroke="#0A7A37" stroke-opacity="0.08" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- flagstick + pennant (top-left) -->
    <path d="M34 30 V64"/>
    <circle cx="34" cy="66" r="2.4" fill="#0A7A37" fill-opacity="0.07" stroke="none"/>
    <path d="M34 31 H56 L47 38 L56 45 H34 Z" fill="#0A7A37" fill-opacity="0.06" stroke="none"/>
    <!-- golf ball (bottom-right) -->
    <circle cx="116" cy="112" r="12"/>
    <g fill="#0A7A37" fill-opacity="0.09" stroke="none">
      <circle cx="111" cy="108" r="1.1"/>
      <circle cx="117" cy="107" r="1.1"/>
      <circle cx="121" cy="112" r="1.1"/>
      <circle cx="114" cy="114" r="1.1"/>
      <circle cx="119" cy="116" r="1.1"/>
    </g>
    <!-- tee dot (top-right) -->
    <path d="M122 40 v8 M118 40 h8" stroke-opacity="0.06"/>
  </g>
</svg>
