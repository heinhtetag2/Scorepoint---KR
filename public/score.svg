<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="56" y1="66" x2="208" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="0.55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="hump" x1="92" y1="48" x2="164" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="0.35" stop-color="#10B981"/>
      <stop offset="0.7" stop-color="#065F46"/>
      <stop offset="1" stop-color="#042F2E"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- subtle soft shadow (no podium) -->
  <ellipse cx="128" cy="196" rx="78" ry="26" fill="#15803D" opacity="0.22" filter="url(#soft)"/>

  <!-- viewfinder hump -->
  <rect x="90" y="44" width="76" height="34" rx="15" fill="url(#hump)"/>

  <!-- camera body -->
  <rect x="36" y="68" width="184" height="116" rx="32" fill="url(#body)"/>

  <!-- top glossy highlight -->
  <path d="M64 86 Q128 70 192 86 Q156 98 128 98 Q100 98 64 86 Z" fill="#FFFFFF" opacity="0.30"/>

  <!-- lens outer ring -->
  <circle cx="128" cy="128" r="46" fill="#065F46"/>
  <circle cx="128" cy="128" r="39" fill="#047857"/>
  <!-- lens glass -->
  <circle cx="128" cy="128" r="32" fill="url(#lens)"/>
  <!-- lens specular highlights -->
  <ellipse cx="114" cy="114" rx="11" ry="8" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 114 114)"/>
  <circle cx="143" cy="143" r="4" fill="#FFFFFF" opacity="0.45"/>

  <!-- flash -->
  <rect x="178" y="88" width="24" height="17" rx="7" fill="#DCFCE7" opacity="0.92"/>
</svg>
